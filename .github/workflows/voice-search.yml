name: voice search routing

on:
  pull_request:
    paths:
      - agents/voice/tools/search.py
      - agents/voice/tools/__init__.py
      - agents/voice/agent.py
      - agents/tools/beckn/**
      - tests/test_voice_search_backend.py
      - requirements.txt
      - .github/workflows/voice-search.yml

jobs:
  voice-search:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: test-key
      LANGFUSE_TRACING_ENABLED: "false"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_voice_search_backend.py tests/test_voice_agent.py
