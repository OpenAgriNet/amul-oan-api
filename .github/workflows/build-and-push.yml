name: Build and Push Docker Image

on:
  push:
    tags:
      - 'dev-v*'
      - 'uat-v*'
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: dev-amulmitra.amul.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: dev-amulmitra.amul.com/amul-oan-api
          tags: |
            type=ref,event=tag

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # .git is left out of the image, so the release stamp reads this.
          build-args: |
            GIT_SHA=${{ github.sha }}

      # Nothing is pushed unless the image stamps traces with the commit it was built from.
      - name: Check the image's release stamp
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          release=$(docker run --rm --entrypoint python "$IMAGE" -c "from app.services.telemetry_stamps import chat_telemetry_release; print(chat_telemetry_release())")
          echo "release stamp: $release"
          test "$release" = "$GITHUB_SHA"

      - name: Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
