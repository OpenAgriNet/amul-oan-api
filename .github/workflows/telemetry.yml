name: telemetry

# Runs the telemetry contract tests on every PR: the stamps, chat.py against
# telemetry/contracts/turn.v1/chat.json, app/voice against turn.v1/voice.json, and
# the background jobs and frontend events against turn.v1/non_turn.json.
# What reads the telemetry, and its tests, are in amul-telemetry.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_chat_telemetry_schema_stamps.py tests/test_voice_telemetry_contract.py tests/test_non_turn_traces.py
