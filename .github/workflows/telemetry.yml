name: telemetry

# Runs deterministic telemetry and glossary checks on every PR.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  glossary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m helpers.glossary_validation

  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      # chdb is ClickHouse in-process, for the re-import tests.
      - run: pip install -r requirements.txt pytest chdb==4.4.0
      - run: python -m pytest -q tests/test_telemetry_*.py tests/test_chat_telemetry_schema_stamps.py
