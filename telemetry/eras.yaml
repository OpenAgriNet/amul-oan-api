voice_outcome_vocabulary:
  # [code] app/services/voice.py + voice_trace.py:293-295,492-499
  # ⚠️ THESE ARE SEMANTICS, NOT STATUS CODES. Rendering "not success" as a failure
  # rate is wrong by four orders of magnitude: literal outcome='error' totals
  # FIVE rows across the entire lifetime of voice, while stale_request (159,298)
  # and stt_signal (149,363) are same-call re-dispatch and non-speech events BY
  # DESIGN. Any canonical model must carry a three-way
  # success / error / non_question split, never a binary.
  delivered: [success]
  non_question:
    - stale_request
    - stt_signal
    - hold_message
    - greeting_fast_path
    - identity_fast_path
    - fragment_fast_path
    - non_meaningful_hangup
    - outbound_intro
  refused_or_blocked: [moderation_rejected, outbound_declined, outbound_no_data]
  failed: [error, pretranslation_empty, client_disconnected]
  pre_v3_convention: success          # the field did not exist; state it on the chart

# ---------------------------------------------------------------------------
# FIELD AVAILABILITY — the floor under every historical series
# ---------------------------------------------------------------------------
field_availability:
  # R = recorded on the trace, D = derivable from observations, M = missing.
  # "starts" is the era boundary before which the series does not exist at all.
  chat:
    session:            {status: R, starts: 2026-02-02}
    user_id:            {status: R, starts: 2026-02-24, semantics_change: 2026-03-25, empty_before: 2026-03-10}
    channel:            {status: R, starts: 2026-04-24, full_coverage: 2026-05-01}
    question_original:  {status: R, starts: 2026-03-10, source_by_era: true}
    answer:             {status: D, starts: 2026-03-10, trace_level_from: 2026-05-13}
    turn_root:          {status: R, starts: 2026-08-05}
    full_turn_latency:  {status: M, starts: 2026-08-05}
    turn_outcome:       {status: M, starts: 2026-08-03}
    tool_calls:         {status: D, starts: 2026-07-22}
    tokens_and_cost:    {status: D, starts: 2026-02-02}   # observations only, never trace level
    persona:            {status: R, starts: 2026-08-18}
  voice:
    session:            {status: R, starts: 2026-02-02}
    user_id_hash:       {status: R, starts: 2026-05-20}
    outcome:            {status: R, starts: 2026-05-20}
    stage_latency:      {status: R, starts: 2026-05-20}
    question_text:      {status: D, note: "preview+hash only by default, ALL eras"}
    answer_text:        {status: D, note: "preview+hash only by default, ALL eras"}

not_backfillable:
  # Do not promise these. Each is a structural absence, not a query problem.
  - field: chat full-turn latency before 2026-08-05
    why: there was no root span to measure against
    consequence: any "chat p95 since February" chart is fabricated
  - field: chat tool outcomes before 2026-07-22
    why: tools emitted no observations
  - field: chat turn_outcome before 2026-08-03
    why: the score did not exist
  - field: voice outcome before 2026-05-20
    why: the field did not exist (count as success by convention, and SAY SO)
  - field: voice full question/answer text, any era
    why: sanitize_text stores preview+hash by default (voice_trace.py:39-61)
    consequence: fixing it forward is a privacy decision, not a bug fix
  - field: cache-hit farmer/animal lookups, any era
    why: the span is only opened on a cache MISS (farmer_animal_backends.py:74-86)
    consequence: >
      span-derived chat farmer-identity success reads 25.6% where the
      farmer-VISIBLE number is 89.2%. Model output.fetch_reason
      (cold_fetch/request = farmer waiting; background_refresh = invisible SWR),
      never span presence.
  - field: the 60s-cut hung voice turns, as failures
    why: >
      voice.py CancelledError is a BaseException, skips `except Exception`, and
      the finally finalises the turn as "success". Still unfixed.
    consequence: historical voice success rates are overstated by that volume
  - field: chat "answered" rate before ~2026-06
    why: trace.output is largely absent from the schema before ~2026-05-13
    consequence: Feb/Mar failure rates of 99.9% / 93.8% are a COVERAGE ARTIFACT

data_corruption:
  - what: booking turns export the tool's parameters and ticket JSON as the turn's answer
    span: 2026-06-01 (earliest daily on disk; true start earlier) .. 2026-08-10
    rows: 2604                       # across 70 local dailies
    fixed_by: ["84f7dab", "8d475a6"]  # PR #213 -> main, #214 -> amul-prod
    scope: answer column ONLY — question_original falls through to the correct source
    recovery: >
      Re-dumping CANNOT fix these. The true answer survives only in the
      "Amul AI Agent" child observation, so recovery needs a compat rule
      preferring that child over trace.output when trace_input has no `query` key.
    note: >
      ⚠️ NOT a #200 regression, despite an earlier claim in #212/#213. The tools
      always ran inside an active span, so the write always landed; #200 only
      changed which span is the root. Clobbered rows/day show no step at the
      08-05 deploy. Verify a causal story before repeating a reviewer's mechanism.

