# Telemetry schema eras — the machine-readable spine
#
# Ticket: OpenAgriNet/amul-oan-api#179 (telemetry: versioned contract, full path
# coverage, resilient delivery). Design rationale:
#   docs/plans/TELEMETRY_RESILIENCE_PLAN.md  — what we emit next
#   docs/telemetry-strategy/claude-historical-synthesis.md §1, §4.2 — the history
#
# WHY THIS FILE EXISTS
# --------------------
# There is no single telemetry schema in this system. There is a sequence of
# emission regimes, each created by an ordinary product commit that nobody
# classified as a schema change, and each one silently invalidating at least one
# downstream consumer. Three consumers are broken right now because of it. Every
# break was a string literal naming a trace, held in a repo with no link to the
# repo that emits it. This file is the machine-readable version of knowledge that
# until now existed only as scar tissue.
#
# RULES FOR EDITING
# -----------------
# 1. `valid_from` is the PROD-OBSERVED boundary, not the merge date. This history
#    has three independently confirmed multi-week gaps between merge and the step
#    change visible in the data (see commit_vs_deploy_lag below). Where the two
#    disagree the data wins; `merge_date` records who caused it.
# 2. Root trace names are NOT unique across time. `chat.default`/`chat.translation`
#    were used by chat.c2 AND again, for a structurally different object, by
#    chat.c6. Resolve on (name, date) — never on name alone.
# 3. Append eras; never rewrite one. A corrected boundary gets an updated
#    `valid_from` plus a note saying what the old value was and why it moved.
# 4. Keys are append-only going forward. Three names for one concept
#    (pipeline -> variant -> pipeline_profile) is what this file exists to stop.

version: 1
generated: 2026-09-20
# Every claim below is [git] read from history, [code] read at path:line on the
# stated branch, [data] measured against prod ClickHouse, or [memory] carried from
# a prior verified investigation. Unverified deploy dates are marked explicitly.

commit_vs_deploy_lag:
  # Three independent confirmations that a merge date is not a deploy date.
  confirmations:
    - change: chat root -> "Amul AI Agent"
      merged: 2026-05-02
      observed: 2026-05-13
      lag_days: 11
    - change: voice root -> agent_journey
      merged: 2026-06-26
      observed: 2026-07-22
      lag_days: 26
    - change: chat tool observations
      merged: 2026-06-08
      observed: 2026-07-22
      lag_days: 44
  note: >
    The 2026-07-22 clustering is not a coincidence: 0f6c8f4 / ca270d1
    "promote: full dev->prod parity" landed that day in both repos.
    A mass promotion is a mass era boundary.

langfuse_object_kinds_in_use:
  # What this platform actually writes into Langfuse. Anything not listed is not
  # produced by us in any era.
  in_use:
    - sessions
    - traces
    - observations   # types SPAN, TOOL and GENERATION are all in use
    - scores
  not_in_use: [datasets, prompt_management, media]
  note: >
    Prompts are local files loaded via helpers.utils.get_prompt, not Langfuse
    prompt objects. Never filter observations on type='SPAN': chat booking is
    GENERATION, voice booking is SPAN, and the agent-facing tool layer is TOOL.

