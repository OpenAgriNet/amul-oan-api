# Pipeline config for dev voice on VM5.
#
# Loaded as voice.yaml from PIPELINE_CONFIG_DIR (one process serving chat and voice),
# or, until that cutover, by amul_voice_app with PIPELINE_CONFIG_PATH pointing at
# pipeline.voice-dev.yaml (a link to this file), PIPELINE_CHANNEL=voice and
# VOICE_ROUTE_ENABLED=true. It reproduces what voice-oan-api amul-dev builds from the
# dev voice env (its legacy_shim.synthesize_from_env): every session on the oss
# profile, gemma-4-31b-it on both tiers of every step with the managed tier on the
# INFERENCE_ENDPOINT_URL box, and voice-oan-api's default timeouts.
#
# ${NAME} is replaced at boot with that env var, and boot is refused while it is
# unset. api_key_env names the secret; its value is read only when a tier is called.
#
# Left out on purpose:
#   - The agent step's concurrency gate: both agent tiers are vLLM, and the gauge only
#     moves vLLM tiers behind managed ones, so it could never change the order here.
#   - The non_meaningful tier's timeout: the classifier and the consent check use
#     their own VOICE_*_TIMEOUT_SECONDS; nothing reads a tier timeout for this step.

fallback_enabled: true

# Voice's own settings, as dev voice's env sets them today (the env var each
# replaces is in app/llm_core/config_model.py). Read only from PIPELINE_CONFIG_DIR;
# a setting left out falls back to its env var.
settings:
  history_ttl_seconds: 86400
  langfuse_environment: voice-development
  nudge_timeout_seconds: 1.5
  outbound_intro_enabled: true
  agent_prompt_version: mixed
  pretranslation_timeout_seconds: 10.0

profiles:
  - name: oss
    weight: 100
    steps:
      agent:
        tiers:
          - {provider: vllm, model: gemma-4-31b-it, endpoint: "${OSS_INFERENCE_ENDPOINT_URL}", api_key_env: OSS_INFERENCE_API_KEY, timeout_ms: 8000, label: oss-agent}
          - &managed_agent {provider: vllm, model: gemma-4-31b-it, endpoint: "${INFERENCE_ENDPOINT_URL}", api_key_env: INFERENCE_API_KEY, timeout_ms: 20000, label: managed-agent}
      # Moderation and pretranslation share one managed client and model, as in voice-oan-api.
      moderation:
        tiers:
          - {provider: vllm, model: gemma-4-31b-it, endpoint: "${OSS_INFERENCE_ENDPOINT_URL}", api_key_env: OSS_INFERENCE_API_KEY, timeout_ms: 5000, label: oss-moderation}
          - &managed_pretranslation {provider: vllm, model: gemma-4-31b-it, endpoint: "${INFERENCE_ENDPOINT_URL}", api_key_env: INFERENCE_API_KEY, timeout_ms: 20000, label: managed-pretranslation}
      pre_translation:
        tiers:
          - {provider: vllm, model: gemma-4-31b-it, endpoint: "${OSS_INFERENCE_ENDPOINT_URL}", api_key_env: OSS_INFERENCE_API_KEY, timeout_ms: 10000, label: oss-pretranslation}
          - *managed_pretranslation

  # No session lands here. Voice reads it for the non-meaningful and consent
  # classifiers, and moderation falls back to it if the oss primary can't be built.
  - name: managed
    weight: 0
    steps:
      agent: {tiers: [*managed_agent]}
      moderation: {tiers: [*managed_pretranslation]}
      pre_translation: {tiers: [*managed_pretranslation]}

defaults:
  non_meaningful:
    tiers:
      - {provider: vllm, model: gemma-4-31b-it, endpoint: "${OSS_INFERENCE_ENDPOINT_URL}", api_key_env: OSS_INFERENCE_API_KEY, label: non-meaningful}
  # Gemma 4 translates first, constrained to Gujarati script (target_script_only);
  # TranslateGemma serves when it fails before the first token.
  post_translation:
    tiers:
      - {provider: vllm, model: gemma-4-31b-it, endpoint: "${TRANSLATION_GEMMA_ENDPOINT}", api_key_env: OSS_INFERENCE_API_KEY, timeout_ms: 30000, ttft_ms: 5000, target_script_only: true, label: gemma-translator}
      - {provider: translategemma, model: translategemma-27b-base, endpoint: "${TRANSLATEGEMMA_27B_BASE_ENDPOINT}", timeout_ms: 60000, ttft_ms: 5000, label: translategemma}
      - {provider: vllm, model: gemma-4-31b-it, endpoint: "${INFERENCE_ENDPOINT_URL}", api_key_env: INFERENCE_API_KEY, timeout_ms: 30000, label: llm-fallback}
